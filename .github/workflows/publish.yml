name: Publish

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing; no API token stored in the repository
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest -q
      - name: Check the tag matches the package version
        run: test "${GITHUB_REF_NAME#v}" = "$(uv run python -c 'import harfix; print(harfix.__version__)')"
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
