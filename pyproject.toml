[project]
name = "harfix"
version = "0.6.0"
description = "Quality gate for Arabic PDF text layers: detect garbled, reversed, or unmapped Arabic before it reaches your index."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "Ahmad Sebaq", email = "ahmad.sebaq@gmail.com" }]
keywords = ["arabic", "pdf", "rag", "ocr", "text-extraction", "data-quality"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: Arabic",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = ["pdfminer.six>=20240706"]

[project.scripts]
harfix = "harfix.cli:main"

[project.urls]
Homepage = "https://github.com/asebaq/harfix"
Issues = "https://github.com/asebaq/harfix/issues"
Changelog = "https://github.com/asebaq/harfix/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.7"]
# Only needed to rebuild the packaged language model and thresholds.
model = ["duckdb>=1.1", "arabic-reshaper>=3.0"]
# Only needed to retrain the packaged font maps (scripts/train_font_maps.py).
decoder = ["numpy>=1.26", "scipy>=1.11"]
# Only needed to benchmark `check` on docling-parse output (scripts/benchmark.py extractors).
extractors = ["docling-parse>=7.22"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harfix"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
